<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" style="background-color: #F8FAFC; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Smooth presentation drop shadows -->
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="header-shadow" x="-8%" y="-10%" width="120%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="inspector-hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="ai-hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="rules-hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="admin-hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="960" fill="url(#bg-grad)"/>

  <!-- Top Institutional Authority Banner -->
  <g transform="translate(800, 56)" text-anchor="middle">
    <!-- Mini Regulatory Tag -->
    <g transform="translate(0, -26)">
      <rect x="-180" y="-12" width="360" height="24" rx="12" fill="#0A2540" stroke="#CBD5E1" stroke-width="1"/>
      <text y="4" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1">LEGAL METROLOGY (PACKAGED COMMODITIES) RULES, 2011</text>
    </g>
    <text y="24" font-size="28" font-weight="800" fill="#0A2540" letter-spacing="-0.5">PARAKH - Digital Compliance Inspection System Architecture</text>
    <text y="50" font-size="13.5" font-weight="500" fill="#64748B">End-to-End Automated Pipeline: Package Intake ➔ AI Computer Vision ➔ Rule Engine ➔ Legal Enforcement</text>
  </g>

  <!-- Overarching Continuous Regulatory Loop -->
  <g transform="translate(100, 134)">
    <rect width="1400" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 220 0 C 450 -24, 1150 -24, 1380 0" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
    <text x="700" y="24" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">
      🔄 Continuous Regulatory Loop: Field Intake ➔ AI Optical Extraction ➔ Deterministic Statutory Audit ➔ Legal Action Memo
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: FIELD INSPECTOR PORTAL (Intake)                                 -->
  <!-- ========================================================================= -->
  <g id="col-inspector" transform="translate(100, 196)">
    <!-- Header Card -->
    <rect width="320" height="95" rx="16" fill="url(#inspector-hdr)" stroke="#10B981" stroke-width="2" filter="url(#header-shadow)"/>
    <!-- Inspector / Scanner Icon -->
    <g transform="translate(25, 23)">
      <circle cx="24" cy="24" r="22" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <path d="M 16 18 L 32 18 M 16 24 L 28 24 M 16 30 L 25 30" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="31" cy="29" r="4" fill="#059669"/>
    </g>
    <text x="88" y="46" font-size="17" font-weight="700" fill="#065F46">Field Inspector Portal</text>
    <text x="88" y="68" font-size="11.5" font-weight="500" fill="#047857">Inspection Officer / Citizen Intake</text>

    <!-- Step 1: Multi-Face Package Capture -->
    <g transform="translate(0, 130)">
      <rect width="320" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#065F46" text-anchor="middle">Multi-Face Package Capture</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#14532D" opacity="0.85" text-anchor="middle">Front, Back, Side &amp; MRP Display Panels</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="160" y1="210" x2="160" y2="240" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

    <!-- Step 2: PDP & Spatial Dimensioning -->
    <g transform="translate(0, 245)">
      <rect width="320" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#065F46" text-anchor="middle">PDP &amp; Spatial Dimensioning</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#14532D" opacity="0.85" text-anchor="middle">Principal Display Panel Area (cm²) Input</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="160" y1="325" x2="160" y2="355" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

    <!-- Step 3: Real-Time Field Submission -->
    <g transform="translate(0, 360)">
      <rect width="320" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#065F46" text-anchor="middle">Real-Time Field Submission</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#14532D" opacity="0.85" text-anchor="middle">GPS Geo-Tagging &amp; Offline Cache Sync</text>
    </g>

    <!-- Arrow to Database -->
    <line x1="160" y1="440" x2="160" y2="480" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

    <!-- Database Cylinder -->
    <g transform="translate(45, 485)">
      <rect width="230" height="80" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#card-shadow)"/>
      <g transform="translate(20, 16)">
        <ellipse cx="20" cy="12" rx="16" ry="7" fill="#BAE6FD" stroke="#0369A1" stroke-width="1.8"/>
        <path d="M 4 12 L 4 24 A 16 7 0 0 0 36 24 L 36 12" fill="#BAE6FD" stroke="#0369A1" stroke-width="1.8"/>
        <path d="M 4 24 L 4 36 A 16 7 0 0 0 36 36 L 36 24" fill="#7DD3FC" stroke="#0369A1" stroke-width="1.8"/>
      </g>
      <text x="75" y="36" font-size="14.5" font-weight="700" fill="#0369A1">Central Database</text>
      <text x="75" y="56" font-size="11" font-weight="500" fill="#075985">SQLite / Inspection Logs &amp; Evidence</text>
    </g>
  </g>

  <!-- Horizontal Arrow: Inspector -> AI Extraction -->
  <g transform="translate(425, 238)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="15" y="-8" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">Stream</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: AI & VISION EXTRACTION ENGINE                                   -->
  <!-- ========================================================================= -->
  <g id="col-ai" transform="translate(460, 196)">
    <!-- Header Card -->
    <rect width="320" height="95" rx="16" fill="url(#ai-hdr)" stroke="#6366F1" stroke-width="2" filter="url(#header-shadow)"/>
    <!-- AI / OCR Icon -->
    <g transform="translate(25, 23)">
      <circle cx="24" cy="24" r="22" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <rect x="15" y="15" width="18" height="18" rx="3" fill="none" stroke="#4338CA" stroke-width="2"/>
      <path d="M 19 22 L 29 22 M 19 26 L 26 26" stroke="#4338CA" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="88" y="46" font-size="17" font-weight="700" fill="#3730A3">AI &amp; Vision Extraction</text>
    <text x="88" y="68" font-size="11.5" font-weight="500" fill="#4F46E5">Computer Vision &amp; OCR Pipeline</text>

    <!-- Step 1: Optical Text Recognition (OCR) -->
    <g transform="translate(0, 130)">
      <rect width="320" height="92" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="30" font-size="14.5" font-weight="700" fill="#312E81" text-anchor="middle">Optical Text Recognition (OCR)</text>
      
      <!-- OCR Feature Pills -->
      <g transform="translate(24, 48)">
        <rect x="0" width="80" height="24" rx="12" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1"/>
        <text x="40" y="16" font-size="10.5" font-weight="700" fill="#3730A3" text-anchor="middle">Tesseract</text>

        <rect x="88" width="86" height="24" rx="12" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1"/>
        <text x="131" y="16" font-size="10.5" font-weight="700" fill="#3730A3" text-anchor="middle">Confidence</text>

        <rect x="182" width="88" height="24" rx="12" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1"/>
        <text x="226" y="16" font-size="10.5" font-weight="700" fill="#3730A3" text-anchor="middle">Multi-angle</text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="160" y1="222" x2="160" y2="248" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>

    <!-- Step 2: Numeral & Typography Audit -->
    <g transform="translate(0, 252)">
      <rect width="320" height="80" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#312E81" text-anchor="middle">Table I Numeral Height Audit</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#3730A3" opacity="0.85" text-anchor="middle">Measured Height (mm) vs Statutory Min.</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="160" y1="332" x2="160" y2="358" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>

    <!-- Step 3: Key Entity Bounding Boxes -->
    <g transform="translate(0, 362)">
      <rect width="320" height="80" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#312E81" text-anchor="middle">Key Entity Bounding Boxes</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#3730A3" opacity="0.85" text-anchor="middle">MRP, Net Qty, Dates, Origin &amp; Packer</text>
    </g>
  </g>

  <!-- Horizontal Arrow: AI -> Rule Engine -->
  <g transform="translate(785, 238)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="15" y="-8" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">Verify</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: LEGAL METROLOGY RULE ENGINE                                     -->
  <!-- ========================================================================= -->
  <g id="col-rules" transform="translate(820, 196)">
    <!-- Header Card -->
    <rect width="320" height="95" rx="16" fill="url(#rules-hdr)" stroke="#F59E0B" stroke-width="2" filter="url(#header-shadow)"/>
    <!-- Rules / Scale Icon -->
    <g transform="translate(25, 23)">
      <circle cx="24" cy="24" r="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
      <path d="M 24 14 L 24 34 M 17 18 L 31 18 M 15 26 L 19 26 M 29 26 L 33 26" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="88" y="46" font-size="17" font-weight="700" fill="#92400E">PCR Rule Engine</text>
    <text x="88" y="68" font-size="11.5" font-weight="500" fill="#B45309">Deterministic Statutory Logic</text>

    <!-- Step 1: 10 Statutory Rule Evaluation -->
    <g transform="translate(0, 130)">
      <rect width="320" height="92" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="30" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle">10 Statutory Rule Audit</text>
      
      <!-- Status Badges -->
      <g transform="translate(26, 48)">
        <rect x="0" width="80" height="24" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
        <text x="40" y="16" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">✓ PASS</text>

        <rect x="92" width="80" height="24" rx="12" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
        <text x="132" y="16" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">✕ FAIL</text>

        <rect x="184" width="84" height="24" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
        <text x="226" y="16" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">? REVIEW</text>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="160" y1="222" x2="160" y2="248" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

    <!-- Step 2: Clause & Penalty Mapping -->
    <g transform="translate(0, 252)">
      <rect width="320" height="80" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle">Statutory Clause Mapping</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#92400E" opacity="0.85" text-anchor="middle">Rules 6(1)(a)-(f), Rule 12 &amp; Legal Citations</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="160" y1="332" x2="160" y2="358" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

    <!-- Step 3: Violation Discrepancy Flagging -->
    <g transform="translate(0, 362)">
      <rect width="320" height="80" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle">Discrepancy &amp; Defect Flagging</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#92400E" opacity="0.85" text-anchor="middle">Missing Tax Clauses, Unit Errors, Contrast</text>
    </g>
  </g>

  <!-- Horizontal Arrow: Rule Engine -> Enforcement -->
  <g transform="translate(1145, 238)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="15" y="-8" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">Escalate</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: ENFORCEMENT & ADMIN DASHBOARD                                   -->
  <!-- ========================================================================= -->
  <g id="col-admin" transform="translate(1180, 196)">
    <!-- Header Card -->
    <rect width="320" height="95" rx="16" fill="url(#admin-hdr)" stroke="#3B82F6" stroke-width="2" filter="url(#header-shadow)"/>
    <!-- Admin / Shield Icon -->
    <g transform="translate(25, 23)">
      <circle cx="24" cy="24" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
      <path d="M 24 14 L 33 18 L 33 25 C 33 30 29 34 24 36 C 19 34 15 30 15 25 L 15 18 Z" fill="none" stroke="#1E40AF" stroke-width="2"/>
      <path d="M 21 25 L 23 27 L 27 22" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="88" y="46" font-size="17" font-weight="700" fill="#1E40AF">Enforcement Dashboard</text>
    <text x="88" y="68" font-size="11.5" font-weight="500" fill="#2563EB">Directorate of Legal Metrology</text>

    <!-- Step 1: Central Monitoring & Heatmaps -->
    <g transform="translate(0, 130)">
      <rect width="320" height="80" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#1E40AF" text-anchor="middle">State / National Monitoring</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#1D4ED8" opacity="0.85" text-anchor="middle">Violation Rates, Category Hotspots &amp; Trends</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="160" y1="210" x2="160" y2="240" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: Evidence-Backed Inspection Memo -->
    <g transform="translate(0, 245)">
      <rect width="320" height="80" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Legal Inspection Memo &amp; Notice</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#1D4ED8" opacity="0.85" text-anchor="middle">PDF Seizure Memo with Tamper-Proof Trail</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="160" y1="325" x2="160" y2="355" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

    <!-- Step 3: Officer Allocation & Rule Matrix -->
    <g transform="translate(0, 360)">
      <rect width="320" height="80" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
      <text x="160" y="34" font-size="14.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Officer RBAC &amp; Rule Updates</text>
      <text x="160" y="56" font-size="11" font-weight="500" fill="#1D4ED8" opacity="0.85" text-anchor="middle">Inspector Rosters, Gazette Notifications</text>
    </g>
  </g>

  <!-- Bottom Regulatory Credential Bar -->
  <g transform="translate(800, 920)" text-anchor="middle">
    <text y="0" font-size="12" font-weight="600" fill="#94A3B8">PARAKH Platform Architecture · Ministry of Consumer Affairs, Food &amp; Public Distribution · Smart India Hackathon (SIH)</text>
  </g>
</svg>
